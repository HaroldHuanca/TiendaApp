{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="page-header">
        <h1 class="page-title">Categorías</h1>
        <div class="page-actions">
            <a href="{{ url_for('productos_web') }}" class="btn btn-outline">Ver Productos</a>
            <a href="{{ url_for('ventas_web') }}" class="btn btn-primary">+ Nueva Venta</a>
        </div>
    </div>
        <div class="data-table-wrapper" id="div-tabla">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbody-tabla">
                    </tbody>
            </table>
        </div>
        <div class="empty-state" id="div-vacio" style="display: none;">
            <div class="empty-state-icon">📁</div>
            <h3 class="empty-state-title">No hay categorías registradas</h3>
            <p class="empty-state-message">Comienza agregando tu primera categoría</p>
        </div>
</div>

<script>
    // 1. Definición de la URL de la API
    const API_URL = 'http://localhost:5000/categorias/mostrar_categorias';
    
    // 2. Obtención de referencias a los elementos del DOM
    const tablaBody = document.getElementById('tbody-tabla');
    const divTabla = document.getElementById('div-tabla');
    const divVacio = document.getElementById('div-vacio');

    /**
     * Función para crear una fila de tabla (<tr>) a partir de un objeto de categoría.
     * @param {Object} categoria - Un objeto de categoría con propiedades 'id' y 'nombre'.
     * @returns {string} El HTML de la fila de la tabla.
     */
    function crearFila(categoria) {
        return `
            <tr>
                <td>${categoria.id}</td>
                <td>${categoria.nombre}</td>
                <td>
                    <div class="table-actions">
                        <a href="#" class="btn btn-icon btn-edit" title="Editar">✏️</a>
                        <button onclick="eliminarCategoria(${categoria.id})" 
                                class="btn btn-icon btn-delete" title="Eliminar">🗑️</button>
                    </div>
                </td>
            </tr>
        `;
    }

    /**
     * Función principal para cargar y renderizar las categorías.
     */
    async function cargarCategorias() {
        try {
            // Realiza la petición GET a la API
            const response = await fetch(API_URL, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            // Verifica si la respuesta es exitosa
            if (!response.ok) {
                // Lanza un error si el estado HTTP no es 200 (OK)
                throw new Error(`Error en la API: ${response.status} ${response.statusText}`);
            }

            // Parsea la respuesta JSON
            const data = await response.json();
            
            // Verifica si la data es un array y si tiene elementos
            if (Array.isArray(data) && data.length > 0) {
                // Hay datos: Llenar la tabla
                const filasHTML = data.map(crearFila).join('');
                tablaBody.innerHTML = filasHTML;
                
                // Mostrar la tabla y ocultar el estado vacío
                divTabla.style.display = 'block';
                divVacio.style.display = 'none';

            } else {
                // No hay datos (array vacío o no es un array válido)
                tablaBody.innerHTML = ''; // Limpiar por seguridad
                
                // Ocultar la tabla y mostrar el estado vacío
                divTabla.style.display = 'none';
                divVacio.style.display = 'block';
            }
            
        } catch (error) {
            console.error('Error al cargar las categorías:', error);
            // Mostrar un mensaje de error al usuario si la API falla
            divTabla.style.display = 'none';
            divVacio.innerHTML = `<div class="empty-state-icon">⚠️</div>
                                  <h3 class="empty-state-title">Error de Conexión</h3>
                                  <p class="empty-state-message">No se pudieron cargar los datos. Revisa la consola para más detalles.</p>`;
            divVacio.style.display = 'block';
        }
    }

    // Ejecutar la función cuando el DOM esté completamente cargado
    document.addEventListener('DOMContentLoaded', cargarCategorias);

    // ************ FUNCIÓN DE EJEMPLO PARA LA ACCIÓN DE ELIMINAR ************
    function eliminarCategoria(id) {
        alert(`Implementar la lógica de eliminación para el ID: ${id}`);
        // Después de la eliminación exitosa, deberías llamar a cargarCategorias() nuevamente
        // para actualizar la tabla: cargarCategorias();
    }
</script>
{% endblock %}

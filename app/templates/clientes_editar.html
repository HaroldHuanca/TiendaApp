{%extends "base.html" %}
{%block content %}
<div class="card">
    <div class="page-header"><h1 class="page-title">Editar Cliente</h1></div>
    <form id="clienteForm">
        <div class="form-group">
            <label class="form-label required">Documento</label>
            <input type="text" name="documento" class="form-control" value="{{ cliente.Documento }}" required>
        </div><div class="form-group">
            <label class="form-label required">Nombre</label>
            <input type="text" name="nombre" class="form-control" value="{{ cliente.Nombre }}" required>
        </div>
        <div class="form-group">
            <label class="form-label required">Estado</label>
            <select name="descripcion_estado" class="form-control" required>
                <option value="Activo" {%if cliente.Descripcion_Estado == 'Activo'%}selected{%endif%}>Activo</option>
                <option value="Inactivo" {%if cliente.Descripcion_Estado == 'Inactivo'%}selected{%endif%}>Inactivo</option>
            </select>
        </div>
        <div class="form-actions">
            <a href="{{url_for('cliente_bp.clientes_lista')}}" class="btn btn-outline">Cancelar</a>
            <button type="submit" class="btn btn-primary">Actualizar</button>
        </div>
    </form>
</div>
<script>
document.getElementById('clienteForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const data = { "documento": formData.get("documento"), "nombre": formData.get("nombre"), "descripcion_estado": formData.get("descripcion_estado") };
    fetch('/actualizar_cliente/{{ cliente.ID_Cliente }}', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    }).then(r => r.json()).then(d => {
        if (d.mensaje) { alert(d.mensaje); window.location.href = '{{url_for("cliente_bp.clientes_lista")}}'; }
        else if (d.error) { alert('Error: ' + d.error); }
    });
});
</script>
{%endblock%}

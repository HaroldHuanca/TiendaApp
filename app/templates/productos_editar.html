{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="page-header">
        <h1 class="page-title">Editar Producto</h1>
    </div>

    <form id="productoForm" method="PUT">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label required">Código de Barras</label>
                <input type="text" name="codigo_barras" class="form-control" value="{{ producto.codigo_Barras }}"
                    required maxlength="13">
            </div>

            <div class="form-group">
                <label class="form-label required">Descripción</label>
                <input type="text" name="descripcion" class="form-control" value="{{ producto.descripcion }}" required
                    maxlength="1500">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label required">Categoría</label>
                <select name="nombre_categoria" class="form-control" required>
                    <option value="">Seleccione una categoría</option>
                    {% for categoria in categorias %}
                    <option value="{{ categoria.Nombre }}" {% if categoria.Nombre == producto.categoria %}selected{% endif %}>
                        {{ categoria.Nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label required">Unidad</label>
                <select name="nombre_unidad" class="form-control" required>
                    <option value="">Seleccione una unidad</option>
                    {% for unidad in unidades %}
                    <option value="{{ unidad.Nombre }}" {% if unidad.Nombre == producto.unidad %}selected{% endif %}>
                        {{ unidad.Nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label required">Precio de Compra</label>
                <input type="number" name="precio_compra" class="form-control" value="{{ producto.precio_compra }}"
                    step="0.01" min="0" required>
            </div>

            <div class="form-group">
                <label class="form-label required">Precio de Venta</label>
                <input type="number" name="precio_venta" class="form-control" value="{{ producto.precio_venta }}"
                    step="0.01" min="0" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label required">Stock</label>
                <input type="number" name="stock" class="form-control" value="{{ producto.stock }}" step="0.01" min="0"
                    required>
            </div>

            <div class="form-group">
                <label class="form-label required">Stock Mínimo</label>
                <input type="number" name="stock_minimo" class="form-control" value="{{ producto.stock_minimo }}"
                    step="0.01" min="0" required>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label required">Estado</label>
            <select name="descripcion_estado" class="form-control" required>
                <option value="ACTIVO" {% if producto.estado == 'ACTIVO' %}selected{% endif %}>Activo</option>
                <option value="INACTIVO" {% if producto.estado == 'INACTIVO' %}selected{% endif %}>Inactivo</option>
            </select>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('producto_bp.productos_lista') }}" class="btn btn-outline">Cancelar</a>
            <button type="submit" class="btn btn-primary">Actualizar Producto</button>
        </div>
    </form>
</div>

<script>
    document.getElementById('productoForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const formData = new FormData(this);
        const data = {
            codigo_barras: formData.get('codigo_barras'),
            nombre_categoria: formData.get('nombre_categoria'),
            nombre_unidad: formData.get('nombre_unidad'),
            descripcion: formData.get('descripcion'),
            precio_compra: parseFloat(formData.get('precio_compra')),
            precio_venta: parseFloat(formData.get('precio_venta')),
            stock: parseFloat(formData.get('stock')),
            stock_minimo: parseFloat(formData.get('stock_minimo')),
            descripcion_estado: formData.get('descripcion_estado')
        };

        fetch('/productos/actualizar_producto/{{ producto.id }}', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
            .then(response => response.json())
            .then(data => {
                if (data.mensaje) {
                    alert(data.mensaje);
                    window.location.href = '{{ url_for("producto_bp.productos_lista") }}';
                } else if (data.error) {
                    alert('Error: ' + data.error);
                }
            })
            .catch(error => {
                alert('Error al actualizar el producto');
                console.error('Error:', error);
            });
    });
</script>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="page-header"><h1 class="page-title">Editar Categoría</h1></div>
    <form id="categoriaForm">
        <div class="form-group">
            <label class="form-label required">Nombre</label>
            <input type="text" name="nombre" class="form-control" value="{{ categoria.Nombre }}" required maxlength="100">
        </div>
        <div class="form-actions">
            <a href="{{ url_for('categoria_bp.categorias_lista') }}" class="btn btn-outline">Cancelar</a>
            <button type="submit" class="btn btn-primary">Actualizar</button>
        </div>
    </form>
</div>
<script>
document.getElementById('categoriaForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    fetch('/actualizar_categoria/{{ categoria.ID_Categoria }}', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre: formData.get('nombre') })
    }).then(r => r.json()).then(d => {
        if (d.mensaje) { alert(d.mensaje); window.location.href = '{{ url_for("categoria_bp.categorias_lista") }}'; }
        else if (d.error) { alert('Error: ' + d.error); }
    });
});
</script>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<!-- Modal -->
{% include 'components/modal_proveedor.html' %}

<div class="card">
    <div class="page-header">
        <h1 class="page-title">Proveedores</h1>
        <div class="page-actions">
            <button class="btn btn-primary" onclick="abrirModalNuevo()">+ Nuevo Proveedor</button>
        </div>
    </div>

    <!-- Buscador de Proveedores -->
    <div style="margin-bottom: 20px;">
        <input type="text" id="filtroNombre" class="form-control"
            placeholder="🔍 Buscar proveedor por nombre o RUC..."
            style="padding: 10px; border: 1px solid var(--border-color); border-radius: var(--border-radius); width: 100%;">
    </div>

    <!-- Tabla Responsiva -->
    <div class="data-table-wrapper" id="div-tabla">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>RUC</th>
                    <th>Nombre</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tbody-tabla">
            </tbody>
        </table>
    </div>

    <!-- Estado Vacío -->
    <div class="empty-state" id="div-vacio" style="display: none;">
        <div class="empty-state-icon">🏢</div>
        <h3 class="empty-state-title">No hay proveedores registrados</h3>
        <p class="empty-state-message">Comienza agregando tu primer proveedor</p>
    </div>
</div>

<script>
    // Variables globales
    const API_URL = `${window.location.origin}/proveedores`;
    const ESTADO_API_URL = `${window.location.origin}/estados`;

    let proveedorActual = null;
    let todosLosProveedores = []; // Para filtrar

    // Referencias a los elementos del DOM
    const tablaBody = document.getElementById('tbody-tabla');
    const divTabla = document.getElementById('div-tabla');
    const divVacio = document.getElementById('div-vacio');
    const modal = document.getElementById('modalProveedor');
    const modalTitulo = document.getElementById('modalTituloProveedor');
    const filtroNombre = document.getElementById('filtroNombre');

    /**
     * Crear una fila de tabla a partir de un objeto de proveedor
     */
    function crearFila(proveedor) {
        return `
            <tr>
                <td>${proveedor.ID_Proveedor || proveedor.id}</td> <!-- Ajustar key segun backend -->
                <td>${proveedor.RUC || proveedor.ruc}</td>
                <td>${proveedor.Nombre || proveedor.nombre}</td>
                <td><span class="badge badge-${(proveedor.Estado || proveedor.estado) === 'Activo' ? 'success' : 'danger'}">${proveedor.Estado || proveedor.estado}</span></td>
                <td>
                    <div class="table-actions">
                        <button class="btn btn-icon btn-edit" title="Editar" onclick="abrirModalEditar(${proveedor.ID_Proveedor || proveedor.id}, '${proveedor.RUC || proveedor.ruc}', '${proveedor.Nombre || proveedor.nombre}', '${proveedor.Estado || proveedor.estado}')" style="background: none; border: none; color: var(--info-color); cursor: pointer; font-size: 1.25rem;">✏️</button>
                        <button class="btn btn-icon btn-delete" title="Eliminar" onclick="eliminarProveedor(${proveedor.ID_Proveedor || proveedor.id})" style="background: none; border: none; color: var(--danger-color); cursor: pointer; font-size: 1.25rem;">🗑️</button>
                    </div>
                </td>
            </tr>
        `;
    }

    /**
     * Renderizar tabla con los proveedores
     */
    function renderizarTabla(proveedores) {
        if (Array.isArray(proveedores) && proveedores.length > 0) {
            const filasHTML = proveedores.map(crearFila).join('');
            tablaBody.innerHTML = filasHTML;
            divTabla.style.display = 'block';
            divVacio.style.display = 'none';
        } else {
            tablaBody.innerHTML = '';
            divTabla.style.display = 'none';
            if (todosLosProveedores.length === 0) {
                divVacio.innerHTML = `<div class="empty-state-icon">🏢</div>
                                      <h3 class="empty-state-title">No hay proveedores registrados</h3>
                                      <p class="empty-state-message">Comienza agregando tu primer proveedor</p>`;
            } else {
                divVacio.innerHTML = `<div class="empty-state-icon">🔍</div>
                                      <h3 class="empty-state-title">Sin resultados</h3>
                                      <p class="empty-state-message">No hay proveedores que coincidan con tu búsqueda</p>`;
            }
            divVacio.style.display = 'block';
        }
    }

    /**
     * Cargar proveedores desde la API
     */
    async function cargarProveedores() {
        try {
            const response = await fetch(`${API_URL}/mostrar_proveedores`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error(`Error en la API: ${response.status} ${response.statusText}`);
            }

            const data = await response.json();
            todosLosProveedores = data; // Guardar todos los proveedores para filtrar
            renderizarTabla(data);

        } catch (error) {
            console.error('Error al cargar los proveedores:', error);
            divTabla.style.display = 'none';
            divVacio.innerHTML = `<div class="empty-state-icon">⚠️</div>
                                  <h3 class="empty-state-title">Error de Conexión</h3>
                                  <p class="empty-state-message">No se pudieron cargar los datos. Intenta nuevamente.</p>`;
            divVacio.style.display = 'block';
        }
    }

    /**
     * Filtrar proveedores por nombre o RUC
     */
    function filtrarProveedores(termino) {
        const terminoTrim = termino.trim().toLowerCase();

        // Si tiene menos de 3 caracteres, volvemos a mostrar todos
        /*if (terminoTrim.length < 3) {
            renderizarTabla(todosLosProveedores);
            return;
        }*/

        const proveedoresFiltrados = todosLosProveedores.filter(proveedor => {
            const nombre = (proveedor.Nombre || proveedor.nombre || '').toLowerCase();
            const ruc = (proveedor.RUC || proveedor.ruc || '').toLowerCase();
            return nombre.includes(terminoTrim) || ruc.includes(terminoTrim);
        });

        renderizarTabla(proveedoresFiltrados);
    }

    /**
     * Cargar estados desde la API
     */
    async function cargarEstados() {
        try {
            const response = await fetch(`${ESTADO_API_URL}/mostrar_estados/tbl_proveedores`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error(`Error en la API: ${response.status}`);
            }

            const estados = await response.json();
            // Ordenar alfabéticamente si tienen descripcion
            if (estados.length > 0 && estados[0].descripcion) {
                estados.sort((a, b) => a.descripcion.localeCompare(b.descripcion));
            }

            const selectEstado = document.getElementById('estadoProveedor');
            selectEstado.innerHTML = ''; // Remover opción por defecto

            estados.forEach(estado => {
                const option = document.createElement('option');
                option.value = estado.descripcion; // Asumiendo que el valor enviado es la descripción en lugar del ID, según la lógica de productos
                option.textContent = estado.descripcion;
                selectEstado.appendChild(option);
            });

            // Seleccionar el primero si hay elementos
            if (estados.length > 0) {
                selectEstado.selectedIndex = 0;
            }

        } catch (error) {
            console.error('Error al cargar estados:', error);
        }
    }

    /**
     * Abrir modal para crear nuevo proveedor
     */
    function abrirModalNuevo() {
        proveedorActual = null;
        modalTitulo.textContent = 'Nuevo Proveedor';
        document.getElementById('formProveedor').reset();

        // Reset select estado
        const selectEstado = document.getElementById('estadoProveedor');
        if (selectEstado.options.length > 0) selectEstado.selectedIndex = 0;

        modal.classList.add('active');
    }

    /**
     * Abrir modal para editar proveedor existente
     * Los datos se pasan directamente para evitar otra llamada
     */
    function abrirModalEditar(id, ruc, nombre, estado) {
        proveedorActual = { id, ruc, nombre, estado };
        modalTitulo.textContent = 'Editar Proveedor';

        document.getElementById('rucProveedor').value = ruc;
        document.getElementById('nombreProveedor').value = nombre;
        document.getElementById('estadoProveedor').value = estado;

        modal.classList.add('active');
    }

    /**
     * Cerrar modal
     */
    function cerrarModalProveedor() {
        modal.classList.remove('active');
        proveedorActual = null;
        document.getElementById('formProveedor').reset();
    }

    /**
     * Guardar proveedor (crear o actualizar)
     */
    async function guardarProveedor() {
        const ruc = document.getElementById('rucProveedor').value.trim();
        const nombre = document.getElementById('nombreProveedor').value.trim();
        const estado = document.getElementById('estadoProveedor').value;

        // Validaciones
        if (!ruc && !estado.includes('SIN DOCUMENTO')) {
            Swal.fire({ icon: 'warning', title: 'Campo Requerido', text: 'Por favor ingresa el RUC', confirmButtonText: 'Ok' });
            return;
        }
        if (!nombre) {
            Swal.fire({ icon: 'warning', title: 'Campo Requerido', text: 'Por favor ingresa el nombre', confirmButtonText: 'Ok' });
            return;
        }
        if (!estado) {
            Swal.fire({ icon: 'warning', title: 'Campo Requerido', text: 'Por favor selecciona un estado', confirmButtonText: 'Ok' });
            return;
        }

        try {
            const datos = {
                ruc: ruc,
                nombre: nombre,
                descripcion_estado: estado
            };

            let url, metodo;
            if (proveedorActual) {
                // Editar
                url = `${API_URL}/actualizar_proveedor/${proveedorActual.id}`;
                metodo = 'PUT';
            } else {
                // Crear
                url = `${API_URL}/insertar_proveedor`;
                metodo = 'POST';
            }

            const response = await fetch(url, {
                method: metodo,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || `Error: ${response.status}`);
            }

            Swal.fire({
                icon: 'success',
                title: 'Éxito',
                text: proveedorActual ? 'Proveedor actualizado correctamente' : 'Proveedor creado correctamente',
                confirmButtonText: 'Ok'
            }).then(() => {
                cerrarModalProveedor();
                cargarProveedores();
            });

        } catch (error) {
            console.error('Error al guardar proveedor:', error);
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: error.message || 'Error al guardar el proveedor'
            });
        }
    }

    /**
     * Eliminar proveedor
     */
    async function eliminarProveedor(id) {
        Swal.fire({
            title: '¿Eliminar Proveedor?',
            text: 'Esta acción no se puede deshacer',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Sí, eliminar',
            cancelButtonText: 'Cancelar'
        }).then(async (result) => {
            if (result.isConfirmed) {
                try {
                    const response = await fetch(`${API_URL}/eliminar_proveedor/${id}`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`Error: ${response.status}`);
                    }

                    Swal.fire({
                        icon: 'success',
                        title: 'Eliminado',
                        text: 'Proveedor eliminado correctamente',
                        confirmButtonText: 'Ok'
                    }).then(() => {
                        cargarProveedores();
                    });

                } catch (error) {
                    console.error('Error al eliminar proveedor:', error);
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'Error al eliminar el proveedor'
                    });
                }
            }
        });
    }

    // Cargar datos al iniciar la página
    document.addEventListener('DOMContentLoaded', () => {
        cargarProveedores();
        cargarEstados();
    });

    // Agregar listener al filtro
    filtroNombre.addEventListener('input', (e) => {
        filtrarProveedores(e.target.value);
    });
</script>

<style>
    .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.85rem;
        font-weight: 600;
    }

    .badge-success {
        background-color: #d4edda;
        color: #155724;
    }

    .badge-danger {
        background-color: #f8d7da;
        color: #721c24;
    }

    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--spacing-lg);
    }

    .page-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-primary);
        margin: 0;
    }

    .data-table-wrapper {
        overflow-x: auto;
        border-radius: var(--border-radius);
        border: 1px solid var(--border-color);
    }

    .data-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 600px;
    }

    .data-table th,
    .data-table td {
        padding: var(--spacing-md);
        text-align: left;
        border-bottom: 1px solid var(--border-color);
    }

    .data-table th {
        background-color: var(--bg-secondary);
        font-weight: 600;
        color: var(--text-secondary);
    }

    .data-table tr:last-child td {
        border-bottom: none;
    }

    .table-actions {
        display: flex;
        gap: var(--spacing-sm);
    }

    .empty-state {
        text-align: center;
        padding: var(--spacing-xl) 0;
        color: var(--text-secondary);
    }

    .empty-state-icon {
        font-size: 3rem;
        margin-bottom: var(--spacing-md);
    }

    .empty-state-title {
        font-size: 1.25rem;
        margin-bottom: var(--spacing-sm);
        color: var(--text-primary);
    }
</style>
{% endblock %}

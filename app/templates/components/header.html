<header class="header">
    <div class="header-left">
        <button class="btn btn-icon" id="sidebarToggle" title="Abrir menú">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <h5 class="mb-0" style="margin-left: 10px;">{% block page_title %}Dashboard{% endblock %}</h5>
    </div>

    <div class="header-right">
        <!-- Dropdown Usuario -->
        <div class="dropdown">
            <button class="btn btn-link dropdown-toggle d-flex align-items-center gap-2" id="userDropdown" type="button">
                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
                    style="width: 40px; height: 40px; flex-shrink: 0;">
                    <strong>{{ usuario[0]|upper if usuario else 'U' }}</strong>
                </div>
                <span class="d-md-inline" style="display: none;">{{ usuario }}</span>
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Mi Perfil</a></li>
                <li><a class="dropdown-item" href="#">Configuración</a></li>
                <li class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="{{ url_for('logout') }}">Cerrar Sesión</a></li>
            </ul>
        </div>
    </div>
</header>

<script>
    // Controlar dropdown de usuario
    const userDropdown = document.getElementById('userDropdown');
    const dropdownMenu = userDropdown?.nextElementSibling;

    if (userDropdown && dropdownMenu) {
        userDropdown.addEventListener('click', function(e) {
            e.preventDefault();
            dropdownMenu.parentElement.classList.toggle('active');
        });

        // Cerrar dropdown al hacer clic fuera
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.dropdown')) {
                dropdownMenu.parentElement.classList.remove('active');
            }
        });
    }
</script>

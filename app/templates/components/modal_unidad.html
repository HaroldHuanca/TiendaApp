<!-- Modal para Crear/Editar Unidades -->
<div id="modalUnidad" class="modal">
    <div class="modal-overlay" onclick="cerrarModal()"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitulo">Nueva Unidad</h3>
            <button class="modal-close" onclick="cerrarModal()">&times;</button>
        </div>
        <form id="formUnidad" class="modal-body">
            <div class="form-group">
                <label for="nombreUnidad" class="form-label">Nombre de la Unidad</label>
                <input 
                    type="text" 
                    id="nombreUnidad" 
                    class="form-control" 
                    placeholder="Ej: Kilogramo, Litro, Metro"
                    required
                >
            </div>
        </form>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
            <button type="button" class="btn btn-primary" onclick="guardarUnidad()">Guardar</button>
        </div>
    </div>
</div>

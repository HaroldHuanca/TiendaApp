<!-- Modal para Crear/Editar Proveedores -->
<div id="modalProveedor" class="modal">
    <div class="modal-overlay" onclick="cerrarModalProveedor()"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTituloProveedor">Nuevo Proveedor</h3>
            <button class="modal-close" onclick="cerrarModalProveedor()">&times;</button>
        </div>
        <form id="formProveedor" class="modal-body">
            <!-- RUC -->
            <div class="form-group">
                <label for="rucProveedor" class="form-label">RUC</label>
                <input type="text" id="rucProveedor" class="form-control" placeholder="Ej: 20123456789" required>
            </div>

            <!-- Nombre -->
            <div class="form-group">
                <label for="nombreProveedor" class="form-label">Nombre</label>
                <input type="text" id="nombreProveedor" class="form-control" placeholder="Ej: Proveedor SAC" required>
            </div>

            <!-- Estado -->
            <div class="form-group">
                <label for="estadoProveedor" class="form-label">Estado</label>
                <select id="estadoProveedor" class="form-control" required>
                    <option value="">-- Seleccionar Estado --</option>
                </select>
            </div>
        </form>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline" onclick="cerrarModalProveedor()">Cancelar</button>
            <button type="button" class="btn btn-primary" onclick="guardarProveedor()">Guardar</button>
        </div>
    </div>
</div>

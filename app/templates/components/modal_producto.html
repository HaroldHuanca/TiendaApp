<!-- Modal para Crear/Editar Productos -->
<div id="modalProducto" class="modal">
    <div class="modal-overlay" onclick="cerrarModalProducto()"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTituloProducto">Nuevo Producto</h3>
            <button class="modal-close" onclick="cerrarModalProducto()">&times;</button>
        </div>
        <form id="formProducto" class="modal-body">
            <!-- Código de Barras -->
            <div class="form-group">
                <label for="codigoBarras" class="form-label">Código de Barras</label>
                <input 
                    type="text" 
                    id="codigoBarras" 
                    class="form-control" 
                    placeholder="Ej: 1234567890123"
                    required
                >
                <small id="mensajeCodigoBarras" style="color: #e74c3c; display: none;"></small>
            </div>

            <!-- Nombre de Unidad -->
            <div class="form-group">
                <label for="nombreUnidad" class="form-label">Unidad de Medida</label>
                <select id="nombreUnidad" class="form-control" required>
                    <option value="">-- Seleccionar Unidad --</option>
                </select>
            </div>

            <!-- Nombre de Categoría -->
            <div class="form-group">
                <label for="nombreCategoria" class="form-label">Categoría</label>
                <select id="nombreCategoria" class="form-control" required>
                    <option value="">-- Seleccionar Categoría --</option>
                </select>
            </div>

            <!-- Descripción -->
            <div class="form-group">
                <label for="descripcion" class="form-label">Descripción</label>
                <input 
                    type="text" 
                    id="descripcion" 
                    class="form-control" 
                    placeholder="Ej: Descripción del producto"
                    required
                >
            </div>

            <!-- Precio de Compra -->
            <div class="form-group">
                <label for="precioCompra" class="form-label">Precio de Compra</label>
                <input 
                    type="number" 
                    id="precioCompra" 
                    class="form-control" 
                    placeholder="0.00"
                    step="0.01"
                    min="0"
                    required
                >
            </div>

            <!-- Precio de Venta -->
            <div class="form-group">
                <label for="precioVenta" class="form-label">Precio de Venta</label>
                <input 
                    type="number" 
                    id="precioVenta" 
                    class="form-control" 
                    placeholder="0.00"
                    step="0.01"
                    min="0"
                    required
                >
            </div>

            <!-- Stock -->
            <div class="form-group">
                <label for="stock" class="form-label">Stock</label>
                <input 
                    type="number" 
                    id="stock" 
                    class="form-control" 
                    placeholder="0"
                    step="0.01"
                    min="0"
                    required
                >
            </div>

            <!-- Stock Mínimo -->
            <div class="form-group">
                <label for="stockMinimo" class="form-label">Stock Mínimo</label>
                <input 
                    type="number" 
                    id="stockMinimo" 
                    class="form-control" 
                    placeholder="0"
                    step="0.01"
                    min="0"
                    required
                >
            </div>

            <!-- Estado -->
            <div class="form-group">
                <label for="descriptionEstado" class="form-label">Estado</label>
                <select id="descriptionEstado" class="form-control" required>
                    <option value="">-- Seleccionar Estado --</option>
                </select>
            </div>
        </form>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline" onclick="cerrarModalProducto()">Cancelar</button>
            <button type="button" class="btn btn-primary" onclick="guardarProducto()">Guardar</button>
        </div>
    </div>
</div>

    }

    }

</style>
